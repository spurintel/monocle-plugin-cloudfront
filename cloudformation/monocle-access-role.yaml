AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cross-account IAM role that lets Spur Monocle deploy and manage its
  CloudFront integration (CloudFront Function, KeyValueStore, Lambda@Edge) in
  this account. Monocle assumes this role with the External ID shown in the
  Monocle dashboard; no long-lived credentials are ever exchanged.

Parameters:
  SpurAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: >-
      Spur's AWS account id (pre-filled by the Monocle dashboard). Only
      principals in this account can assume the role.
  ExternalId:
    Type: String
    MinLength: 8
    MaxLength: 128
    Description: >-
      The External ID shown in the Monocle dashboard for this app. Required on
      every AssumeRole call (confused-deputy defence); keep it exactly as shown.
  RoleName:
    Type: String
    Default: MonocleAccess
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"
    Description: Name for the created role.

Resources:
  # The ceiling on every monocle-* role this access role creates. IAM has no
  # condition key for the CONTENTS of an inline policy, so PutRolePolicy alone
  # could otherwise grant a role anything; a boundary caps the role's effective
  # permissions no matter what is written onto it.
  MonocleRoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${RoleName}-role-boundary"
      Description: Maximum permissions any Monocle-created role may exercise.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Lambda@Edge writes its logs in the region nearest the viewer.
          - Effect: Allow
            Action:
              - "logs:CreateLogGroup"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
            Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/*monocle-*"
          # The breaker state and the crawler snapshot.
          - Effect: Allow
            Action:
              - "cloudfront-keyvaluestore:DescribeKeyValueStore"
              - "cloudfront-keyvaluestore:GetKey"
              - "cloudfront-keyvaluestore:ListKeys"
              - "cloudfront-keyvaluestore:UpdateKeys"
            Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:key-value-store/*"
          # The scheduler role invokes the verify Lambda for the hourly refresh.
          - Effect: Allow
            Action: "lambda:InvokeFunction"
            Resource: !Sub "arn:aws:lambda:us-east-1:${AWS::AccountId}:function:monocle-*"

  MonocleAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Assumed by Spur Monocle to manage its CloudFront integration.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${SpurAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Policies:
        - PolicyName: MonocleCloudfrontIntegration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read distributions (the picker) and update the chosen one to
              # attach/detach Monocle's behaviors and function associations.
              - Sid: Distributions
                Effect: Allow
                Action:
                  - "cloudfront:ListDistributions"
                  - "cloudfront:GetDistribution"
                  - "cloudfront:GetDistributionConfig"
                  - "cloudfront:UpdateDistribution"
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              # Monocle's own edge resources, all named monocle-*.
              - Sid: EdgeFunction
                Effect: Allow
                Action:
                  - "cloudfront:CreateFunction"
                  - "cloudfront:UpdateFunction"
                  - "cloudfront:PublishFunction"
                  - "cloudfront:DescribeFunction"
                  - "cloudfront:DeleteFunction"
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:function/monocle-*"
              - Sid: KeyValueStore
                Effect: Allow
                Action:
                  - "cloudfront:CreateKeyValueStore"
                  - "cloudfront:DescribeKeyValueStore"
                  - "cloudfront:DeleteKeyValueStore"
                # A store's id is issued by AWS, so a template cannot name it;
                # this at least keeps the grant inside this account.
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:key-value-store/*"
              - Sid: KeyValueStoreData
                Effect: Allow
                Action:
                  - "cloudfront-keyvaluestore:DescribeKeyValueStore"
                  - "cloudfront-keyvaluestore:ListKeys"
                  - "cloudfront-keyvaluestore:UpdateKeys"
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:key-value-store/*"
              # The verify Lambda@Edge (us-east-1, monocle-* only).
              # EnableReplication is what CloudFront calls when the function is
              # associated with the distribution.
              - Sid: VerifyLambda
                Effect: Allow
                Action:
                  - "lambda:CreateFunction"
                  - "lambda:DeleteFunction"
                  - "lambda:GetFunction"
                  - "lambda:PublishVersion"
                  # UpdateFunctionCode is how a redeploy publishes a new version:
                  # an @Edge function attached to a distribution is replicated
                  # and cannot be deleted-and-recreated, so it is updated in
                  # place. UpdateFunctionConfiguration is included for future
                  # config changes that don't ship in the bundle.
                  - "lambda:UpdateFunctionCode"
                  - "lambda:UpdateFunctionConfiguration"
                  - "lambda:EnableReplication*"
                Resource: !Sub "arn:aws:lambda:us-east-1:${AWS::AccountId}:function:monocle-*"
              # The FIRST Lambda@Edge association in an account makes AWS create
              # two service-linked roles (the Lambda replicator and the
              # CloudFront logger); without this it fails with "not authorized
              # to create or assume a service linked role" (verified live).
              # One-time per account; scoped to those two roles' paths only.
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: "iam:CreateServiceLinkedRole"
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/replicator.lambda.amazonaws.com/*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/logger.cloudfront.amazonaws.com/*"
              # The Lambda's execution role (monocle-* only). PassRole is what
              # lets the created role be attached to the Lambda; scoped so
              # Monocle can never grant itself an unrelated role. PutRolePolicy
              # is how the dashboard grants that role KeyValueStore Get/Update
              # for the breaker and crawler snapshot.
              # Reading and removing a monocle-* role needs no ceiling.
              - Sid: LambdaRoleRead
                Effect: Allow
                Action:
                  - "iam:GetRole"
                  - "iam:DeleteRole"
                  - "iam:DetachRolePolicy"
                  - "iam:DeleteRolePolicy"
                  - "iam:UpdateAssumeRolePolicy"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/monocle-*"
              # Creating or granting one is capped by the boundary above, so a
              # monocle-* role can never hold more than the integration needs
              # even though the dashboard writes its inline policies.
              - Sid: LambdaRoleWrite
                Effect: Allow
                Action:
                  - "iam:CreateRole"
                  - "iam:PutRolePolicy"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/monocle-*"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary": !Ref MonocleRoleBoundary
              # Sets (or repairs) the boundary itself; it can only ever be ours.
              - Sid: LambdaRoleBoundary
                Effect: Allow
                Action: "iam:PutRolePermissionsBoundary"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/monocle-*"
                Condition:
                  StringEquals:
                    "iam:PermissionsBoundary": !Ref MonocleRoleBoundary
              # The one AWS-managed policy the Lambda role needs. Without this
              # condition the role could attach AdministratorAccess to a role it
              # created and pass it to a function it also created.
              - Sid: LambdaRoleAttachPolicy
                Effect: Allow
                Action: "iam:AttachRolePolicy"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/monocle-*"
                Condition:
                  ArnEquals:
                    "iam:PolicyARN": "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
              # Handing a monocle-* role to the two services that run our code.
              - Sid: LambdaRolePassRole
                Effect: Allow
                Action: "iam:PassRole"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/monocle-*"
                Condition:
                  StringEquals:
                    "iam:PassedToService":
                      - "lambda.amazonaws.com"
                      - "edgelambda.amazonaws.com"
                      - "scheduler.amazonaws.com"
              # Hourly crawler refresh: EventBridge Scheduler in us-east-1
              # invokes the same Lambda the distribution uses at origin-request.
              - Sid: CrawlerSchedule
                Effect: Allow
                Action:
                  - "scheduler:CreateSchedule"
                  - "scheduler:UpdateSchedule"
                  - "scheduler:DeleteSchedule"
                Resource: !Sub "arn:aws:scheduler:us-east-1:${AWS::AccountId}:schedule/default/monocle-*"
              # Lets EventBridge Scheduler invoke the Lambda; removed on teardown.
              - Sid: LambdaInvokePermission
                Effect: Allow
                Action:
                  - "lambda:AddPermission"
                  - "lambda:RemovePermission"
                Resource: !Sub "arn:aws:lambda:us-east-1:${AWS::AccountId}:function:monocle-*"
              - Sid: SchedulerServiceLinkedRole
                Effect: Allow
                Action: "iam:CreateServiceLinkedRole"
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/scheduler.amazonaws.com/*"

Outputs:
  RoleArn:
    Description: Paste this into the Monocle dashboard's Connect AWS step.
    Value: !GetAtt MonocleAccessRole.Arn
  RoleBoundaryArn:
    Description: >-
      The permissions boundary every Monocle-created role carries. The dashboard
      sets it on each role it creates; nothing needs to be copied by hand.
    Value: !Ref MonocleRoleBoundary
