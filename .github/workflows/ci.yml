name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Load the edge-core deploy key
        uses: ./.github/actions/setup-edge-core
        with:
          ssh-key: ${{ secrets.MONOCLE_EDGE_CORE_SSH_KEY }}

      - name: Install dependencies
        # No install scripts run while the deploy key is loaded; none are needed.
        run: npm ci --ignore-scripts

      - name: Drop the deploy key
        # Nothing after the install needs it, and everything after runs dependency code.
        run: ssh-agent -k

      - name: Typecheck
        # esbuild strips types and vitest transpiles without checking them, so
        # without this nothing in CI ever type-checks the source.
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Confirms the Function stays under the 10 KB runtime limit and the
        # Lambda still bundles, so a broken build can't reach the release workflow.
        run: npm run build
